[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-mission-pipeline-vv-lab"
version = "0.1.0"
description = "Synthetic V&V benchmark for precision astrometry and rare-event satellite pipelines"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Pratyush Kumar Das"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
space-mission-vv = "space_mission_vv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
